# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One web service serves both the static site and /api from a single Node
# process, so there is no routing layer to keep in sync.
#
# Deploy: push this repo to GitHub, then in Render choose
#   New → Blueprint → pick the repo. Set the three secret values when prompted.

services:
  - type: web
    name: alaa-agro
    runtime: docker
    dockerfilePath: ./Dockerfile

    # Frankfurt is the closest Render region to Russia and the CIS. Options:
    # oregon | ohio | virginia | frankfurt | singapore.
    region: frankfurt

    # `free` spins the service down after ~15 min idle, which means a ~50s cold
    # start for the next visitor — bad for a lead-generation site. `starter`
    # stays warm. Change this one word if you want to trial it for free first.
    plan: starter

    healthCheckPath: /api/healthz

    envVars:
      # sync: false = set the value in the Render dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false

      # Must be an address listed under Senders in Brevo — NOT the SMTP login,
      # which Brevo rejects. alaa-argo.com is domain-authenticated (DKIM +
      # DMARC), so mail from this address is signed by the domain itself; that
      # is what keeps delivery to mail.ru out of the spam folder. Not a secret,
      # so it lives here rather than in the dashboard.
      - key: BREVO_SENDER_EMAIL
        value: noreply@alaa-argo.com

      - key: QUOTE_RECIPIENT_EMAIL
        value: Alaa.agro_trade@mail.ru
      # Canonical origin for canonical/hreflang/og:url and the SEO manifest.
      # Must match the domain verified in Search Console (AGRO, not ARGO).
      - key: PUBLIC_ORIGIN
        value: https://alaa-agro.com

      - key: NODE_ENV
        value: production
