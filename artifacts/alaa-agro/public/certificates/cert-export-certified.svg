  <path d="M80,18 L138,44 L138,90 Q138,132 80,148 Q22,132 22,90 L22,44 Z"
    fill="none" stroke="#C29A3D" stroke-width="0.7" opacity="0.35"/>
  <!-- Ship silhouette -->
  <g transform="translate(80,72)" fill="none" stroke="#C29A3D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hull -->
    <path d="M-28,10 Q-24,18 0,20 Q24,18 28,10 Z"/>
    <!-- Deck -->
    <line x1="-28" y1="10" x2="28" y2="10"/>
    <!-- Cabin -->
    <rect x="-8" y="-2" width="16" height="12" rx="1"/>
    <!-- Mast -->
    <line x1="0" y1="-20" x2="0" y2="-2"/>
    <!-- Boom -->
    <line x1="-14" y1="-14" x2="14" y2="-14"/>
    <!-- Flag -->
    <path d="M0,-20 L12,-16 L0,-12 Z" fill="#C29A3D" opacity="0.4" stroke="none"/>
    <!-- Water lines -->
    <path d="M-32,22 Q-24,19 -16,22 Q-8,25 0,22 Q8,19 16,22 Q24,25 32,22" opacity="0.45"/>
  </g>
  <line x1="36" y1="108" x2="124" y2="108" stroke="#C29A3D" stroke-width="0.7" opacity="0.45"/>
  <text x="80" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#C29A3D" letter-spacing="1">EXPORT</text>
  <text x="80" y="132" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#C29A3D" letter-spacing="1">CERTIFIED</text>
  <text x="80" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#8A7A5A" letter-spacing="2">ALAA AGRO</text>
</svg>
