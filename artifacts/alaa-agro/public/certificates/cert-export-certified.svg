<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="ebg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2820"/><stop offset="100%" stop-color="#0B1A0F"/>
    </radialGradient>
  </defs>
  <!-- Classic shield -->
  <path d="M80,8 L148,38 L148,90 Q148,140 80,158 Q12,140 12,90 L12,38 Z"
