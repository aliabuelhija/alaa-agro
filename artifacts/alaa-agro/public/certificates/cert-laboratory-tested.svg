      <stop offset="0%" stop-color="#1E2C1A"/><stop offset="100%" stop-color="#0D1F0B"/>
    </radialGradient>
  </defs>
  <!-- Diamond / rhombus -->
  <polygon points="80,4 156,80 80,156 4,80"
