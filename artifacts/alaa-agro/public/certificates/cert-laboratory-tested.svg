    <circle cx="-4" cy="26" r="1" fill="#C29A3D" opacity="0.3" stroke="none"/>
    <circle cx="4" cy="26" r="1" fill="#C29A3D" opacity="0.3" stroke="none"/>
  </g>
  <line x1="42" y1="106" x2="118" y2="106" stroke="#C29A3D" stroke-width="0.7" opacity="0.45"/>
  <text x="80" y="117" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" font-weight="bold" fill="#C29A3D" letter-spacing="0.5">LABORATORY</text>
  <text x="80" y="129" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" font-weight="bold" fill="#C29A3D" letter-spacing="1">TESTED</text>
  <text x="80" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#8A7A5A" letter-spacing="2">ALAA AGRO</text>
