    <!-- Leaf outline -->
    <path d="M0,20 Q-22,8 -18,-10 Q-8,-22 0,-14 Q8,-22 18,-10 Q22,8 0,20 Z" stroke-linejoin="round"/>
    <!-- Leaf vein -->
    <line x1="0" y1="20" x2="0" y2="-14" stroke-width="0.9" opacity="0.6"/>
    <!-- Forbidden circle -->
    <circle cx="0" cy="4" r="18" stroke-width="1.6" opacity="0.8"/>
    <line x1="-13" y1="-9" x2="13" y2="17" stroke-width="1.8"/>
  </g>
  <line x1="34" y1="106" x2="126" y2="106" stroke="#C29A3D" stroke-width="0.7" opacity="0.45"/>
  <text x="80" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#C29A3D" letter-spacing="1.5">NON-GMO</text>
  <text x="80" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#8A7A5A" letter-spacing="1">Declaration</text>
  <text x="80" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#8A7A5A" letter-spacing="2">ALAA AGRO</text>
</svg>
