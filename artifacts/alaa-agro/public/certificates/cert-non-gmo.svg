<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="nbg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1E2C1A"/><stop offset="100%" stop-color="#0D1F0B"/>
    </radialGradient>
  </defs>
  <!-- Pentagon -->
  <polygon points="80,5 154,58 128,148 32,148 6,58"
    fill="url(#nbg)" stroke="#C29A3D" stroke-width="2.2"/>
  <polygon points="80,16 144,64 120,140 40,140 16,64"
