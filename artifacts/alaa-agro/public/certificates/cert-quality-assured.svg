  <!-- Checkmark -->
  <polyline points="72,80 78,86 90,72" fill="none" stroke="#C29A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="96" x2="110" y2="96" stroke="#C29A3D" stroke-width="0.7" opacity="0.5"/>
  <text x="80" y="109" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" font-weight="bold" fill="#C29A3D" letter-spacing="1">QUALITY</text>
  <text x="80" y="121" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" font-weight="bold" fill="#C29A3D" letter-spacing="1">ASSURED</text>
  <text x="80" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#8A7A5A" letter-spacing="2">ALAA AGRO</text>
</svg>
