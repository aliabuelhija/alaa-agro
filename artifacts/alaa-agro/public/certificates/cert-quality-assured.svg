<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="qbg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#22341C"/><stop offset="100%" stop-color="#0D1A0B"/>
    </radialGradient>
  </defs>
  <!-- Laurel wreath ring -->
  <g transform="translate(80,80)" fill="none" stroke="#C29A3D" stroke-width="1.1" opacity="0.75">
    <!-- Left sprigs -->
    <path d="M-40,-5 Q-46,2 -40,10"/><path d="M-38,-14 Q-46,-8 -42,2"/>
    <path d="M-34,-22 Q-44,-18 -40,-8"/><path d="M-28,-28 Q-40,-26 -38,-16"/>
    <path d="M-20,-33 Q-34,-33 -34,-22"/><path d="M-10,-36 Q-26,-38 -28,-28"/>
    <!-- Right sprigs -->
    <path d="M40,-5 Q46,2 40,10"/><path d="M38,-14 Q46,-8 42,2"/>
    <path d="M34,-22 Q44,-18 40,-8"/><path d="M28,-28 Q40,-26 38,-16"/>
    <path d="M20,-33 Q34,-33 34,-22"/><path d="M10,-36 Q26,-38 28,-28"/>
    <!-- Base tie -->
    <path d="M-10,40 Q0,44 10,40" stroke-width="1.4"/>
  </g>
  <circle cx="80" cy="80" r="52" fill="url(#qbg)" stroke="#C29A3D" stroke-width="1.5"/>
  <!-- Award star -->
  <polygon points="80,38 85,54 102,54 88,64 93,80 80,70 67,80 72,64 58,54 75,54"
