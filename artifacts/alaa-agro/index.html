<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <!--
      These tags are what crawlers and link-preview scrapers read, because they
      do not run the JS that SEOHead uses to patch the document per route. They
      must therefore stand on their own for the site root. SEOHead still
      overrides them client-side for in-app navigation.
      Keep in sync with the `seo` block in src/i18n/en.ts.
    -->
    <title>
      ALAA AGRO TRADE LLC | Russian Agricultural Products for Global Trade
    </title>
    <meta
      name="description"
      content="Reliable supply of grains, pulses, oilseeds, seeds, and agricultural commodities from Russia to international B2B buyers. GOST-compliant certification, flexible packaging, worldwide shipping."
    />
    <meta name="robots" content="index, follow" />

    <!-- Yandex Webmaster site verification. Must stay in the static HTML:
         the verifier does not run JS, so SEOHead cannot supply it. -->
    <meta name="yandex-verification" content="344bd44a2530f24a" />

    <link rel="canonical" href="https://alaa-argo.com/en" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALAA AGRO TRADE LLC" />
    <meta property="og:url" content="https://alaa-argo.com/en" />
    <meta
      property="og:title"
      content="ALAA AGRO TRADE LLC | Russian Agricultural Products for Global Trade"
    />
    <meta
      property="og:description"
      content="Reliable supply of grains, pulses, oilseeds, seeds, and agricultural commodities from Russia to international B2B buyers."
    />
    <!--
      Purpose-built 1200x630 card. WhatsApp, Telegram, LinkedIn and Facebook all
      want 1.91:1 and a small file; the raw hero photo was 1536x1024 at 359 KB
      and carried no branding once cropped to a chat thumbnail. Declaring the
      dimensions lets scrapers lay out the preview before the image finishes
      downloading, which is often the difference between a card and a bare link.
    -->
    <meta property="og:image" content="https://alaa-argo.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://alaa-argo.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ALAA AGRO TRADE LLC — Russian agricultural products for global trade"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="ar_AE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ALAA AGRO TRADE LLC | Russian Agricultural Products for Global Trade"
    />
    <meta
      name="twitter:description"
      content="Reliable supply of grains, pulses, oilseeds, seeds, and agricultural commodities from Russia to international B2B buyers."
    />
    <meta name="twitter:image" content="https://alaa-argo.com/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="ALAA AGRO TRADE LLC — Russian agricultural products for global trade"
    />

    <link rel="alternate" hreflang="en" href="https://alaa-argo.com/en" />
    <link rel="alternate" hreflang="ru" href="https://alaa-argo.com/ru" />
    <link rel="alternate" hreflang="ar" href="https://alaa-argo.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://alaa-argo.com/en" />

    <link rel="icon" type="image/png" href="/alaa-agro-logo.png" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%hero/slide-1-port.webp"
      imagesrcset="%BASE_URL%hero/slide-1-port-mobile.webp 768w, %BASE_URL%hero/slide-1-port.webp 1536w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
